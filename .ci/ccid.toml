schema = 1
project = "cblv"
repository = "https://git.corbet.ch/corbet-libre/cblv.git"

[checks.verify]
kind = "commands"
commands = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-features", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked", "--all-features"],
  ["bash", "-c", "set -euo pipefail\nRUSTFLAGS='--cfg getrandom_backend=\"wasm_js\"' cargo check --locked --no-default-features --features client,browser --target wasm32-unknown-unknown --lib"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[check_shell]

[security]
dependencies = "cargo-deny"

[runtime]
tools = ["nodejs", "python3", "cargo-deny", "wasm-pack", "clang", "chromedriver", "chromium", "pkg-config", "openssl.dev", "openssl.out"]

[toolchain]
targets = ["stable:wasm32-unknown-unknown"]
