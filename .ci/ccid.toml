schema = 1
project = "cblv"
repository = "https://git.corbet.ch/corbet-foss/cblv.git"

[checks.verify]
cache = false
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[render]
tool_revision = "10a28f64c3bb63dfade833dd219cba0f504c9345"
tool_sha256 = "fe74ddd559238d99c9fad0655468edebac57be6031156ccbc09e35fb88959243"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
