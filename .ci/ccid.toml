schema = 1
project = "cblv"
repository = "https://git.corbet.ch/corbet-foss/cblv.git"

[checks.verify]
cache = false
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[render]
tool_revision = "2db9dddd5e43d48b6cdbb2728818957db65acf5e"
tool_sha256 = "f5a672c714ca91a87e230713086379f06ad6df6d0ccd9112ee5fbf0cd44f95e7"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
