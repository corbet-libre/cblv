[package]
name = "cblv" # placeholder, rename is mechanical
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Oblivious HTTP (RFC 9458) client and gateway layer for the member-to-server calls"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
publish = false

[features]
default = []
# Device side. Builds for wasm32 (pure-Rust HPKE backend).
client = ["ohttp/client", "dep:getrandom"]
# Server side: tower layer for axum. Native only.
gateway = ["ohttp/server", "dep:axum", "dep:tower", "dep:zeroize", "dep:tokio"]
# In-memory replay store for tests only; never production (no process-local state).
test-store = []

[dependencies]
bhttp = "0.8"
ohttp = { version = "0.8", default-features = false, features = ["rust-hpke"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
getrandom = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true, default-features = false }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio = { version = "1", optional = true, features = ["sync"] }
zeroize = { version = "1", optional = true }

# wasm32 randomness needs RUSTFLAGS --cfg getrandom_backend="wasm_js", as in cmsg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# ohttp's HPKE backend (rand 0.10) pulls getrandom 0.4; enable its browser backend too.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
cblv = { path = ".", features = ["client", "gateway", "test-store"] }
tokio = { version = "1", features = ["macros", "rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
